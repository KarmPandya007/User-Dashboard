<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - User Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'navy': '#0f172a',
                        'slate-blue': '#1e293b',
                        'professional-blue': '#1e40af',
                        'accent-blue': '#3b82f6',
                        'light-blue': '#dbeafe'
                    },
                    fontFamily: {
                        'professional': ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 font-professional">
    <div class="max-w-lg w-full space-y-8">
        <div class="text-center">
            <div class="w-20 h-20 bg-gradient-to-br from-professional-blue to-accent-blue rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
                <i class="fas fa-user-plus text-white text-2xl"></i>
            </div>
            <h2 class="text-4xl font-light text-slate-blue mb-3">Create Account</h2>
            <p class="text-slate-600 text-lg">Join our professional community</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="bg-{{ 'red' if category == 'error' else 'blue' }}-50 border-l-4 border-{{ 'red' if category == 'error' else 'blue' }}-500 text-{{ 'red' if category == 'error' else 'blue' }}-800 px-6 py-4 rounded-r-lg mb-6">
                        <i class="fas fa-{{ 'exclamation-triangle' if category == 'error' else 'info-circle' }} mr-2"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-2xl border border-white/20 px-10 py-12">
            <form method="POST" action="{{ url_for('users.register') }}" class="space-y-8">
                <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                    <div>
                        <label for="name" class="block text-sm font-semibold text-slate-700 mb-3">Full Name</label>
                        <input type="text" id="name" name="name" required
                               class="w-full px-5 py-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-professional-blue focus:border-professional-blue transition-all duration-300 text-slate-blue placeholder-gray-400 bg-white/50"
                               placeholder="Your full name">
                    </div>
                    <div>
                        <label for="age" class="block text-sm font-semibold text-slate-700 mb-3">Age</label>
                        <input type="number" id="age" name="age" min="1" max="120" required
                               class="w-full px-5 py-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-professional-blue focus:border-professional-blue transition-all duration-300 text-slate-blue placeholder-gray-400 bg-white/50"
                               placeholder="Your age">
                    </div>
                </div>
                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-3">Email Address</label>
                    <input type="email" id="email" name="email" required
                           class="w-full px-5 py-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-professional-blue focus:border-professional-blue transition-all duration-300 text-slate-blue placeholder-gray-400 bg-white/50"
                           placeholder="your@email.com">
                </div>
                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-3">Password</label>
                    <input type="password" id="password" name="password" minlength="6" required
                           class="w-full px-5 py-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-professional-blue focus:border-professional-blue transition-all duration-300 text-slate-blue placeholder-gray-400 bg-white/50"
                           placeholder="Create a password">
                </div>
                <div>
                    <label for="confirm_password" class="block text-sm font-semibold text-slate-700 mb-3">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" minlength="6" required
                           class="w-full px-5 py-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-professional-blue focus:border-professional-blue transition-all duration-300 text-slate-blue placeholder-gray-400 bg-white/50"
                           placeholder="Confirm your password">
                </div>
                <button type="submit" 
                        class="w-full bg-gradient-to-r from-professional-blue to-accent-blue text-white py-4 px-6 rounded-xl font-semibold text-lg hover:from-blue-800 hover:to-blue-600 transition-all duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                    Create Account
                </button>
            </form>

            <div class="text-center mt-8">
                <p class="text-slate-600">
                    Already have an account? 
                    <a href="{{ url_for('users.login_page') }}" class="text-professional-blue hover:text-blue-800 font-semibold transition-colors duration-200">Sign in here</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Password confirmation validation
        document.getElementById('confirm_password').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            if (password !== confirmPassword) {
                this.setCustomValidity('Passwords do not match');
            } else {
                this.setCustomValidity('');
            }
        });
    </script>
</body>
</html>
